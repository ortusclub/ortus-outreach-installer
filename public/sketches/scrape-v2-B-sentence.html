<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Scrape v2 — B · One sentence</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/dashboard-v0.3.css" />
<style>
  body{background:var(--paper,#fbfbfa);padding:40px 44px 90px;}
  .wrap{max-width:860px;margin:0 auto;}
  .sk-note{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--gray);margin-bottom:34px;}

  /* The config IS the sentence. Everything underlined is editable in place. */
  .sentence{font-size:1.65rem;line-height:1.85;letter-spacing:-.01em;}
  .sentence .v{border-bottom:1.5px solid var(--gold,#b08d3f);padding-bottom:2px;cursor:pointer;white-space:nowrap;}
  .sentence .v.muted{border-bottom-color:var(--hairline);color:var(--gray);}

  .detail{margin-top:38px;border-top:1px solid var(--hairline);padding-top:26px;}
  .detail[hidden]{display:none;}
  .fl{font-size:12.5px;color:var(--gray);margin:0 0 4px;}
  textarea{width:100%;border:1px solid var(--hairline);background:#fff;padding:12px 14px;
    font-family:var(--mono);font-size:12.5px;resize:vertical;}
  textarea:focus{outline:0;border-color:var(--ink);}

  .swap{display:flex;gap:0;margin:0 0 16px;border:1px solid var(--hairline);width:max-content;}
  .swap button{border:0;background:transparent;padding:8px 18px;font:inherit;font-size:13px;cursor:pointer;}
  .swap button.on{background:var(--ink);color:#fff;}

  .go{display:flex;justify-content:space-between;align-items:center;margin-top:44px;
    border-top:1px solid var(--hairline);padding-top:22px;}
  .recap{font-size:13px;color:var(--gray);}
</style>
</head>
<body data-dashboard="v3">
<div class="wrap">
  <div class="sk-note">Sketch B · One sentence — the whole config reads as a line of English; click any underlined part to change it</div>

  <div class="sentence">
    Scrape <span class="v">4 saved searches</span><br />
    using <span class="v">Mary Simon</span> and <span class="v">Udit Pandey</span><br />
    into <span class="v">Growth sheet</span> · tab <span class="v">test</span><br />
    at <span class="v muted">normal speed</span>.
  </div>

  <div class="detail">
    <div class="swap">
      <button class="on">Paste them</button>
      <button>Use a sheet</button>
    </div>
    <p class="fl">One Sales Navigator search per line</p>
    <textarea rows="5" placeholder="https://www.linkedin.com/sales/search/people?query=…"></textarea>
  </div>

  <div class="go">
    <div class="recap">Nothing runs until you press Start.</div>
    <button class="btn">Start scrape</button>
  </div>
</div>
</body>
</html>
