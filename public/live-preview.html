<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live preview — Ortus Outreach</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font:14px system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}header{padding:12px 16px;border-bottom:1px solid #333;display:flex;gap:12px;align-items:center}h1{font-size:14px;font-weight:600;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}#status{color:#aaa;font-size:12px;white-space:nowrap}main{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:#080808}img[hidden]{display:none}img{display:block;width:100%;height:100%;object-fit:contain}#waiting{position:absolute;inset:0;overflow:auto;padding:22px;color:#bbb;line-height:1.5}#waiting[hidden]{display:none}footer{padding:8px 16px;color:#888;font-size:12px}
h2{font-size:21px;color:#eee;margin:10px 0}#engine,#checked{font-size:12px;color:#999}#next{margin:8px 0}#countdown{color:#ffc46c;font-variant-numeric:tabular-nums}h3{font-size:11px;text-transform:uppercase;letter-spacing:2px;margin:22px 0 8px}#activity{list-style:none;padding:0;margin:0;font-size:12px}#activity li{padding:7px 0;border-top:1px solid #252525;overflow-wrap:anywhere}time{color:#888;margin-right:8px}#checked{margin-top:14px}</style>
</head>
<body><header><h1 id="label">Live preview</h1><span id="status" role="status">Connecting…</span></header><main><img id="stream" alt="Live browser preview" hidden><section id="waiting"><div id="engine">Connecting to engine…</div><h2 id="step">Checking campaign status…</h2><p id="next">The browser preview will appear here when available.</p><div id="countdown"></div><h3>Recent activity</h3><ul id="activity"><li>Waiting for activity from the engine…</li></ul><div id="checked"></div></section></main><footer>Resize or maximise this window for a larger view.</footer><script type="module" src="/js/live-preview.mjs"></script></body>
</html>
